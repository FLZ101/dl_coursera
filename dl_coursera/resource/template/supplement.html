<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ resource_path }}/katex/katex.min.css">
  <script src="{{ resource_path }}/katex/katex.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var math_spans = document.querySelectorAll(
        'span[hasmath="true"], span[hasMath="true"]'
      );

      for (var i = 0; i < math_spans.length; i++) {
        try {
          katex.render(math_spans[i].textContent, math_spans[i], {
            throwOnError: false
          });
        } catch (e) {
          // Keep the original LaTeX text if rendering fails.
        }
      }
    });
  </script>
  <style>
    .content-container {
      max-width: 960px;
      margin: 0 auto;
    }

    pre, p.asset {
      padding: 1em;
      background: #f5f2f0;
      overflow: auto;
    }

    p, h1, h2, h3, h4, h5, h6 {
      font-family: OpenSans,Arial,sans-serif;
      overflow-wrap: break-word;
    }

    img {
      max-width: 100%;
      margin: 0 auto;
    }

    table, th, td {
      border: 1px gray solid;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0 10px;
    }

    .quiz-options {
      list-style: none;
      padding-left: 0;
    }

    .quiz-options li {
      display: flex;
      align-items: center;
      gap: 0.5em;
    }

    .quiz-options input[type='checkbox'],
    .quiz-options input[type='radio'] {
      flex: 0 0 auto;
      margin: 0;
    }

    .quiz-option-text p:first-child {
      margin-top: 0;
    }

    .quiz-option-text p:last-child {
      margin-bottom: 0;
    }

    .quiz-option-text p {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="content-container">
{{ content }}
  </div>
</body>
</html>
